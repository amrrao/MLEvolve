# ============================================================
#  Data & paths
# ============================================================
data_dir: null
dataset_dir: "/home/aa3320/.cache/mle-bench/data"  # path to mle-bench dataset root, e.g. /data/mle-bench
desc_file: null
goal: null
eval: null
exp_name: null
exp_id: ""

log_dir: /mnt/extra/runs  
log_level: INFO              
workspace_dir: /mnt/extra/runs
preprocess_data: True
copy_data: False

# Resource
start_cpu_id: 0
cpu_number: 22

# Model paths
torch_hub_dir: ""       # path to torch hub cache, e.g. /data/pretrain_models/torch_models
pretrain_model_dir: ""  # path to pretrained model weights, e.g. /data/pretrain_models

# ============================================================
#  Code execution
# ============================================================
exec:
  timeout: 1000
  agent_file_name: runfile.py

# ============================================================
#  Agent config
# ============================================================
agent:

  # --- Basic run params ---
  steps: 500
  time_limit: 1000
  initial_drafts: 3
  seed: 42
  data_preview: True

  # --- LLM models ---
  code:
    model: gpt-5-mini-2025-08-07
    temp: 1
    base_url: ""   # OpenAI API endpoint (leave empty for default)
    api_key: ""    # OpenAI API key
  feedback:
    model: gpt-5-mini-2025-08-07
    temp: 1
    base_url: ""   # OpenAI API endpoint (leave empty for default)
    api_key: ""    # OpenAI API key
    
  # --- Submission check ---
  check_data_leakage: True

  # --- Code gen mode ---
  use_diff_mode: True                # SEARCH/REPLACE patch

  # --- Branch strategy ---
  fusion_vs_evolution_prob: 0.3
  branch_fusion_trigger_prob: 1.0
  max_fusion_drafts: 2

  # --- Global memory ---
  use_global_memory: True
  memory_similarity_threshold: 0.7
  memory_embedding_device: cpu
  memory_embedding_model_path: "BAAI/bge-base-en-v1.5"  # HuggingFace model name or local path

  # --------------------------------------------------------
  #  Search tree params
  # --------------------------------------------------------
  search:
    # Parallel & resources
    parallel_search_num: 9
    num_gpus: 0

    # Node expansion limits
    num_drafts: 5
    num_bugs: 1
    num_improves: 3
    topk_max_improves: 10

    # Debug depth
    max_debug_depth: 20
    back_debug_depth: 3
    debug_prob: 1

    # Improvement criteria
    metric_improvement_threshold: 0.0001
    max_improve_failure: 3

    # Stagnation detection
    branch_stagnation_threshold: 3
    topk_stagnation_threshold: 6
    stagnation_window: 4
    top_candidates_size: 20

    # Explore-exploit soft switch
    explore_switch_start: 0.5
    explore_switch_end: 0.7
    min_exploration_weight: 0.2

    # Top-K node selection
    topk_early_k: 5
    topk_early_max_per_branch: 3
    topk_late_k: 3
    topk_late_max_per_branch: 2

    # Force backprop
    force_backprop_late_threshold: 0.80
    force_backprop_late_prob: 0.5
    force_backprop_mid_threshold: 0.4
    force_backprop_mid_modulo: 3
    recent_best_window: 4

    # Multi-branch fusion conditions
    fusion_min_time_hours: 6
    fusion_max_time_hours: 10
    fusion_min_successful_nodes: 2
    fusion_min_branches: 2

    # ---- Error-aware backtracking (AIDE-style MCTS) ----
    # Trigger early backtrack when the same error class is seen this many times
    # in the ancestor debug chain. Set to 0 to disable.
    error_backtrack_threshold: 2
    # Use LLM for semantic error equivalence (true) or fast last-line string match (false)
    use_error_equivalence_check: true

    # ---- Thompson Sampling for branch selection ----
    # When true, replaces UCT at the root level with Beta(alpha, beta) sampling.
    # Branch roots with better descendants accumulate higher alpha over time.
    use_thompson_sampling: true
    thompson_prior_alpha: 1.0   # Beta(1,1) = uniform prior (no bias)
    thompson_prior_beta: 1.0

    # ---- HPO control-loop scoring (ablation flag) ----
    # When true, an LLM rates hyperparameter-tuning thoroughness in {0,1,2,3}
    # for each successful node; reward becomes original + hpo_score_weight*score.
    # Buggy nodes are filtered upstream and never trigger an LLM call.
    use_hpo_score: true
    hpo_score_weight: 0.25

    # ---- Additional notes injection (prompt-level ablation) ----
    # When true, appends ./additional_notes.txt (or /home/instructions.txt fallback)
    # to the task description as an "### Additional Notes" section.
    use_additional_notes: true

  # --------------------------------------------------------
  #  Exploration constant decay
  # --------------------------------------------------------
  decay:
    exploration_constant: 1.414
    lower_bound: 0.5
    alpha: 0.01
    phase_ratios: [0.3, 0.7]

# ============================================================
#  Cold-start knowledge
# ============================================================
coldstart:
  use_coldstart: True
  task_json_path: "engine/coldstart/competition_tag_classified.json"
  model_json_path: "engine/coldstart/models_guidance_classified.json"
  description: ""
